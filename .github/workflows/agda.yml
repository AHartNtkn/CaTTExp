name: Typecheck Agda

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Agda
        run: sudo apt-get update && sudo apt-get install -y agda-bin
      - name: Typecheck
        working-directory: src
        env:
          LC_ALL: C.UTF-8
        run: agda Everything.agda
